services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sh-frontend
    restart: always
    environment:
      - VITE_PROD_BACKEND_URL=http://localhost:9021
    ports:
      - '5174:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sh

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sh-backend
    restart: always
    ports:
      - '9021:9021'
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=hospital
      - PORT=9021
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sh
    command: ['sh', '-c', 'node executeSqlFile.js && npm run start']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9021/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=hospital
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sh
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    name: sh_mysql_data

networks:
  sh:
    driver: bridge
